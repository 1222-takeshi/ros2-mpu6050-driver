name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30
    container:
      image: rostooling/setup-ros-docker@sha256:ae24d1bd0de2d211c87aed13404b1d06c089c1c581f64d943cf61c59f26b1cce
    defaults:
      run:
        shell: bash
    env:
      ROS_LOCALHOST_ONLY: "1"
      ROS_DISTRO: humble
      # Ubuntu 22.04 ships cppcheck 2.7, which ament otherwise skips.
      AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      # Place the colcon workspace outside the checkout root so that
      # ament_lint tools do not traverse into build/install artifacts when they
      # scan source files (which happens when ros_ws is a sub-directory of the
      # checkout).  Also export PYTHONPATH / AMENT_PREFIX_PATH so that all
      # subsequent steps — including CTest sub-processes — can find ament
      # Python modules (e.g. ament_cmake_test).
      - name: Setup workspace and export environment
        run: |
          TASK_ROS_WS="$(mktemp -d "${RUNNER_TEMP}/imu_ws.XXXXXX")"
          echo "ROS_WS=${TASK_ROS_WS}" >> "$GITHUB_ENV"
          mkdir -p "${TASK_ROS_WS}/src"
          ln -s "$GITHUB_WORKSPACE" "${TASK_ROS_WS}/src/imu_driver"
          source /opt/ros/humble/setup.bash
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
          echo "AMENT_PREFIX_PATH=$AMENT_PREFIX_PATH" >> "$GITHUB_ENV"

      - name: Install ROS dependencies
        run: |
          source /opt/ros/humble/setup.bash
          rosdep update
          cd "$ROS_WS"
          rosdep install --from-paths src --ignore-src -y

      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          cd "$ROS_WS"
          colcon build \
            --packages-select imu_driver \
            --cmake-args -DBUILD_TESTING=ON

      - name: Test
        run: |
          source /opt/ros/humble/setup.bash
          cd "$ROS_WS"
          source install/setup.bash
          colcon test \
            --packages-select imu_driver \
            --event-handlers console_cohesion+
          colcon test-result --verbose

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ env.ROS_WS }}/build/imu_driver/test_results/

      - name: Clean temporary workspace
        if: always()
        run: |
          if [[ -n "${ROS_WS:-}" && "$ROS_WS" == "$RUNNER_TEMP"/imu_ws.* ]]; then
            rm -rf -- "$ROS_WS"
          fi
